<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HLS Stream Player</title>
  <style>
    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    video {
      width: 80%;
      max-width: 800px;
      border: 2px solid #fff;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>
<body>

<video id="video" controls autoplay muted playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18"></script>
<script>
  const video = document.getElementById('video');
  const hlsUrl = '/stream/output.m3u8';

  if (Hls.isSupported()) {
    const hls = new Hls({
      lowLatencyMode: true,
      liveSyncDurationCount: 1,
      liveMaxLatencyDurationCount: 3,
      maxLiveSyncPlaybackRate: 1.5,
      backBufferLength: 0
    });
    hls.loadSource(hlsUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, async function () {
      try {
        await video.play();
      } catch (error) {
        console.warn('Autoplay was blocked:', error);
      }
    });
    window.addEventListener('pagehide', () => hls.destroy(), { once: true });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = hlsUrl;
    video.addEventListener('loadedmetadata', async () => {
      try {
        await video.play();
      } catch (error) {
        console.warn('Autoplay was blocked:', error);
      }
    }, { once: true });
  } else {
    alert("Your browser does not support HLS playback.");
  }
</script>

</body>
</html>
